<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>古今鐵道營業線 HGIS 查詢系統</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* =========================================
           基本版面設定
           ========================================= */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: '微軟正黑體', 'PingFang TC', Arial, sans-serif;
            background-color: #f8f9fa;
        }
        #map {
            width: 100vw;
            height: 100%;
        }

        /* =========================================
           右上角藍底系統標題
           ========================================= */
        #system-title {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: rgba(26, 35, 126, 0.9);
            color: white;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            letter-spacing: 1px;
            pointer-events: none;
        }

        /* =========================================
           動態伸縮搜尋列 (預設帶有放大鏡)
           ========================================= */
        #custom-search-box {
            position: absolute;
            top: 15px;
            left: 60px; /* 避開地圖縮放按鈕 */
            background-color: white;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 12.5px center;
            background-size: 20px;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            width: 45px; 
            height: 45px;
            border-radius: 25px;
            overflow: visible; 
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
        }

        #custom-search-box.expanded {
            width: 320px;
            border-radius: 8px;
            cursor: text;
        }

        /* 未展開時隱藏輸入內容 */
        #custom-search-box:not(.expanded) input {
            opacity: 0;
            pointer-events: none;
        }

        #custom-search-box.expanded input {
            opacity: 1;
            pointer-events: auto;
        }

        #custom-search-box input {
            width: 100%;
            height: 45px;
            border: none;
            outline: none;
            background-color: transparent;
            padding-left: 40px;
            font-size: 16px;
            box-sizing: border-box;
        }

        /* 搜尋結果選單 */
        #searchDropdown {
            position: absolute;
            top: 55px;
            left: 0;
            width: 100%;
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 5px;
            display: none;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1001;
        }

        .search-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-size: 15px;
            color: #333;
        }

        .search-item:hover {
            background-color: #f0f4ff;
            color: #1a237e;
        }

        /* =========================================
           手機版自適應
           ========================================= */
        @media (max-width: 768px) {
            #custom-search-box.expanded {
                width: calc(100% - 75px) !important;
                left: 60px !important;
            }

            #system-title {
                top: auto !important;
                bottom: 30px !important;
                left: 50% !important;
                right: auto !important;
                transform: translateX(-50%);
                font-size: 14px !important;
                padding: 8px 15px;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>

    <div id="system-title">古今鐵道營業線 HGIS 查詢</div>

    <div id="custom-search-box">
        <input type="text" id="searchInput" placeholder="搜尋路線名稱..." autocomplete="off">
        <div id="searchDropdown"></div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. 初始化地圖
        const map = L.map('map').setView([23.6978, 120.9605], 7);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let geojsonLayer;
        let allFeatures = [];

        // 2. 讀取資料
        fetch('data.json')
            .then(response => response.json())
            .then(rawData => {
                const geoData = rawData.data || rawData; 
                allFeatures = geoData.features;

                geojsonLayer = L.geoJSON(geoData, {
                    style: { color: "#ff7800", weight: 4, opacity: 0.8 },
                    onEachFeature: function (feature, layer) {
                        if (feature.properties) {
                            let content = `<b>${feature.properties.name || '未命名'}</b>`;
                            if (feature.properties.open_time) content += `<br>通車: ${feature.properties.open_time}`;
                            layer.bindPopup(content);
                        }
                    }
                }).addTo(map);

                if (geojsonLayer.getBounds().isValid()) {
                    map.fitBounds(geojsonLayer.getBounds());
                }
            })
            .catch(err => {
                console.error(err);
                alert('資料載入失敗，請確認 data.json 格式。');
            });

        // 3. 搜尋與顯示邏輯
        const searchBox = document.getElementById('custom-search-box');
        const input = document.getElementById('searchInput');
        const dropdown = document.getElementById('searchDropdown');

        // 渲染清單的函式
        function renderList(val) {
            const keyword = val.trim().toLowerCase();
            dropdown.innerHTML = '';

            // 如果關鍵字為空，則顯示所有路線；否則過濾
            const matched = (keyword === '') 
                ? allFeatures 
                : allFeatures.filter(f => f.properties && f.properties.name && f.properties.name.toLowerCase().includes(keyword));

            if (matched.length > 0) {
                dropdown.style.display = 'block';
                matched.forEach(f => {
                    const item = document.createElement('div');
                    item.className = 'search-item';
                    item.textContent = f.properties.name;
                    item.onclick = () => {
                        dropdown.style.display = 'none';
                        input.value = f.properties.name;
                        
                        geojsonLayer.eachLayer(layer => {
                            if (layer.feature === f) {
                                layer.setStyle({ color: "red", weight: 7, opacity: 1 });
                                if (layer.getBounds) map.fitBounds(layer.getBounds(), { padding: [50, 50] });
                                layer.openPopup();
                            } else {
                                layer.setStyle({ color: "#ff7800", opacity: 0.1, weight: 2 });
                            }
                        });
                    };
                    dropdown.appendChild(item);
                });
            } else {
                dropdown.style.display = 'none';
            }
        }

        // 監聽點擊容器展開
        searchBox.onclick = function(e) {
            if (!this.classList.contains('expanded')) {
                this.classList.add('expanded');
                input.focus();
            }
        };

        // 關鍵修正：當輸入框獲得焦點或點擊時，觸發顯示清單
        input.onfocus = input.onclick = function() {
            renderList(this.value);
        };

        input.oninput = function() {
            renderList(this.value);
        };

        // 點擊外面收合
        document.addEventListener('click', function(e) {
            if (!searchBox.contains(e.target)) {
                if (input.value.trim() === '') {
                    searchBox.classList.remove('expanded');
                    dropdown.style.display = 'none';
                } else {
                    dropdown.style.display = 'none';
                }
            }
        });

        map.on('click', () => dropdown.style.display = 'none');
    </script>
</body>
</html>
