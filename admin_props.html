<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <title>屬性維護 v8.0 - 古今鐵道營業線 HGIS</title>
    <meta charset="utf-8" />
    <style>
        body { font-family: "微軟正黑體", "Segoe UI", sans-serif; background: #eceff1; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1550px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        header { border-bottom: 3px solid #1a237e; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        h2 { color: #1a237e; margin: 0; font-size: 24px; letter-spacing: 1px; }
        
        .panel { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #dee2e6; }
        .panel-title { font-weight: bold; color: #1a237e; margin-bottom: 10px; display: block; border-bottom: 1px dashed #ccc; padding-bottom: 5px; }
        
        .toolbar { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .btn-primary { background: #1a237e; color: white; }
        .btn-primary:hover { background: #283593; }
        .btn-success { background: #2e7d32; color: white; }
        .btn-success:hover { background: #388e3c; }
        .btn-danger { background: #c62828; color: white; padding: 5px 10px; font-size: 12px; }
        .btn-cloud { background: #000; color: white; }
        .btn-cloud:hover { background: #333; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; }
        th { background: #f1f3f9; color: #1a237e; padding: 12px 8px; text-align: left; border-bottom: 2px solid #1a237e; font-size: 14px; }
        td { padding: 8px; border-bottom: 1px solid #eee; overflow: hidden; }
        
        input[type="text"], input[type="password"], select { width: 95%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #1a237e; outline: none; background: #fffde7; }
        
        /* 欄位寬度設定 */
        .col-id { width: 40px; }
        .col-name { width: 120px; }
        .col-section { width: 130px; }
        .col-tailo { width: 150px; }
        .col-status { width: 80px; }
        .col-period { width: 90px; }
        .col-layer { width: 100px; }
        .col-time { width: 100px; }
        .col-desc { width: auto; }
        .col-action { width: 70px; }

        .summary { font-size: 14px; color: #666; }
        .badge { background: #1a237e; color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        
        /* GitHub 設定區塊 */
        .github-config { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; }
        .github-config input { width: 250px; }
        #statusMsg { font-weight: bold; margin-left: 15px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>🛤️ 古今鐵道 HGIS - 屬性維護後台 <small style="font-size: 12px; color: #666;">v8.0 雲端同步版</small></h2>
        <div class="summary" id="summary-text">正在準備資料...</div>
    </header>

    <div class="panel">
        <span class="panel-title">☁️ GitHub 雲端連線設定 (資料僅存在您的瀏覽器中)</span>
        <div class="github-config">
            <div>
                <label>帳號/儲存庫 (Repo):</label><br>
                <input type="text" id="ghRepo" placeholder="例如: yourname/hgis-map">
            </div>
            <div>
                <label>存取權杖 (Token):</label><br>
                <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxx">
            </div>
            <div>
                <label>檔案路徑:</label><br>
                <input type="text" id="ghPath" value="data.json">
            </div>
            <button class="btn btn-primary" onclick="saveSettings()">💾 記住設定</button>
            <span id="statusMsg"></span>
        </div>
        
        <div class="toolbar" style="margin-top: 15px; background: transparent; padding: 0; border: none;">
            <button class="btn btn-cloud" onclick="fetchFromGitHub()">☁️ 1. 從 GitHub 讀取資料</button>
            <button class="btn btn-cloud" onclick="pushToGitHub()">🚀 2. 將修改同步至 GitHub</button>
        </div>
    </div>

    <div class="panel">
        <span class="panel-title">💻 本地檔案操作 (備用)</span>
        <div class="toolbar" style="background: transparent; padding: 0; border: none;">
            <input type="file" id="fileInput" accept=".json" style="display:none" onchange="loadLocalJSON(this)">
            <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">📂 從電腦載入 data.json</button>
            <button class="btn btn-success" onclick="downloadJSON()">💾 下載 JSON 到電腦</button>
        </div>
    </div>

    <table id="propsTable">
        <thead>
            <tr>
                <th class="col-id">#</th>
                <th class="col-name">路線名稱</th>
                <th class="col-section">營運區間 (section)</th>
                <th class="col-tailo">台羅拼音</th>
                <th class="col-status">狀態</th>
                <th class="col-period">時期</th>
                <th class="col-layer">圖層分類</th>
                <th class="col-time">通車時間</th>
                <th class="col-desc">中文描述</th>
                <th class="col-action">操作</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="10" style="text-align:center; padding: 40px; color: #999;">請從上方選擇「從 GitHub 讀取」或「從電腦載入」開始編輯</td></tr>
        </tbody>
    </table>
</div>

<script>
    let fullData = null;
    let currentSha = null; // 儲存 GitHub 檔案的 SHA 值，更新時必須提供

    // --- GitHub API 核心功能 ---
    
    // 初始化時載入儲存的設定
    window.onload = function() {
        if(localStorage.getItem('ghRepo')) document.getElementById('ghRepo').value = localStorage.getItem('ghRepo');
        if(localStorage.getItem('ghToken')) document.getElementById('ghToken').value = localStorage.getItem('ghToken');
        if(localStorage.getItem('ghPath')) document.getElementById('ghPath').value = localStorage.getItem('ghPath');
    }

    function saveSettings() {
        localStorage.setItem('ghRepo', document.getElementById('ghRepo').value);
        localStorage.setItem('ghToken', document.getElementById('ghToken').value);
        localStorage.setItem('ghPath', document.getElementById('ghPath').value);
        showStatus('設定已儲存！', 'green');
    }

    function showStatus(msg, color) {
        const el = document.getElementById('statusMsg');
        el.textContent = msg;
        el.style.color = color;
        setTimeout(() => el.textContent = '', 4000);
    }

    // 解決 JavaScript btoa/atob 處理中文字的編碼問題
    function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }
    function b64_to_utf8(str) { return decodeURIComponent(escape(window.atob(str))); }

    async function fetchFromGitHub() {
        const repo = document.getElementById('ghRepo').value;
        const token = document.getElementById('ghToken').value;
        const path = document.getElementById('ghPath').value;

        if (!repo || !path) return alert("請輸入 Repo 名稱與檔案路徑！");
        
        showStatus('正在從 GitHub 讀取...', 'blue');
        try {
            const response = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                headers: token ? { 'Authorization': `token ${token}` } : {}
            });
            
            if (!response.ok) throw new Error('檔案讀取失敗，請檢查 Repo 名稱或 Token 權限。');
            
            const data = await response.json();
            currentSha = data.sha; // 紀錄指紋
            
            // 解析 Base64
            const jsonString = b64_to_utf8(data.content);
            fullData = JSON.parse(jsonString);
            
            renderTable();
            showStatus('✅ 成功從 GitHub 讀取資料！', 'green');
        } catch (error) {
            showStatus('❌ 讀取失敗: ' + error.message, 'red');
            console.error(error);
        }
    }

    async function pushToGitHub() {
        if (!fullData) return alert("沒有資料可以儲存！請先載入資料。");
        
        const repo = document.getElementById('ghRepo').value;
        const token = document.getElementById('ghToken').value;
        const path = document.getElementById('ghPath').value;

        if (!repo || !token || !path) return alert("請完整填寫 GitHub 設定 (Repo, Token, 路徑) 才能同步！");
        if (!currentSha) return alert("缺少 SHA 指紋，請先執行「從 GitHub 讀取資料」再進行同步！");

        showStatus('正在將資料推送到 GitHub...', 'blue');
        
        try {
            const updatedJson = JSON.stringify(fullData, null, 2);
            const base64Content = utf8_to_b64(updatedJson);

            const response = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: "Update data.json via HGIS Admin UI",
                    content: base64Content,
                    sha: currentSha
                })
            });

            if (!response.ok) throw new Error('同步失敗，可能是 Token 權限不足或檔案衝突。');
            
            const result = await response.json();
            currentSha = result.content.sha; // 更新最新的指紋
            
            showStatus('🚀 成功同步至 GitHub！網頁版將在幾分鐘後更新。', 'green');
        } catch (error) {
            showStatus('❌ 同步失敗: ' + error.message, 'red');
            console.error(error);
        }
    }


    // --- 原本的表格渲染與本地操作邏輯 ---

    function loadLocalJSON(input) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function() {
            try {
                fullData = JSON.parse(reader.result);
                currentSha = null; // 本地載入沒有 SHA
                renderTable();
                showStatus('✅ 已載入本地檔案', 'green');
            } catch (e) { alert("檔案解析出錯！"); }
        };
        reader.readAsText(file);
    }

    function renderTable() {
        if (!fullData) return;
        const features = fullData.data ? fullData.data.features : fullData.features;
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        features.forEach((feature, index) => {
            const props = feature.properties;
            const tr = document.createElement('tr');
            
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td><input type="text" value="${props.name || ''}" onchange="updateProp(${index}, 'name', this.value)"></td>
                <td><input type="text" value="${props.section || ''}" placeholder="例如：嘉義＝北港" onchange="updateProp(${index}, 'section', this.value)"></td>
                <td><input type="text" value="${props.tailo || ''}" onchange="updateProp(${index}, 'tailo', this.value)"></td>
                <td>
                    <select onchange="updateProp(${index}, 'status', this.value)">
                        <option value="營運中" ${props.status === '營運中' ? 'selected' : ''}>營運中</option>
                        <option value="廢止" ${props.status === '廢止' ? 'selected' : ''}>廢止</option>
                        <option value="遺構" ${props.status === '遺構' ? 'selected' : ''}>遺構</option>
                        <option value="未知" ${props.status === '未知' ? 'selected' : ''}>未知</option>
                    </select>
                </td>
                <td><input type="text" value="${props.period || ''}" onchange="updateProp(${index}, 'period', this.value)"></td>
                <td><input type="text" value="${props.layer || ''}" onchange="updateProp(${index}, 'layer', this.value)"></td>
                <td><input type="text" value="${props.open_time || ''}" onchange="updateProp(${index}, 'open_time', this.value)"></td>
                <td><input type="text" value="${props.description ? props.description.zh || '' : ''}" onchange="updateSubProp(${index}, 'description', 'zh', this.value)"></td>
                <td><button class="btn btn-danger" onclick="deleteRoute(${index})">刪除</button></td>
            `;
            tbody.appendChild(tr);
        });
        document.getElementById('summary-text').innerHTML = `目前資料庫共有 <span class="badge">${features.length}</span> 條獨立鐵道要素`;
    }

    function updateProp(index, key, value) {
        const features = fullData.data ? fullData.data.features : fullData.features;
        features[index].properties[key] = value;
    }

    function updateSubProp(index, key, subkey, value) {
        const features = fullData.data ? fullData.data.features : fullData.features;
        if (!features[index].properties[key]) features[index].properties[key] = {};
        features[index].properties[key][subkey] = value;
    }

    function deleteRoute(index) {
        const features = fullData.data ? fullData.data.features : fullData.features;
        const routeName = features[index].properties.name || "這條未命名路線";
        if (confirm(`🚨 確定要永久刪除「${routeName}」嗎？`)) {
            features.splice(index, 1);
            renderTable();
        }
    }

    function downloadJSON() {
        if (!fullData) return alert("請先載入檔案！");
        const outputData = JSON.stringify(fullData, null, 2);
        const blob = new Blob([outputData], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "data_updated.json";
        a.click();
        URL.revokeObjectURL(url);
    }
</script>
</body>
</html>
